# Mechanical Bull — tienda de repuestos y taller
# Instalación completa:  ./scripts/setup.sh
name: mechanical-bull

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  wordpress:
    build: .
    image: mechanical-bull-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('FS_METHOD', 'direct');
        define('WP_MEMORY_LIMIT', '256M');
        define('MB_SMTP_HOST', 'mailpit');
        define('MB_SMTP_PORT', 1025);
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/mechanical-bull:/var/www/html/wp-content/themes/mechanical-bull
      - ./wp-content/plugins/mb-core:/var/www/html/wp-content/plugins/mb-core

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db

  # Captura los correos que envía la tienda (pedidos, avisos) para revisarlos sin enviarlos de verdad
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
  wp_data:
